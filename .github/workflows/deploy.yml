name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # déclenchement manuel possible
  repository_dispatch:        # déclenchement depuis le dépôt de données
    types: [data-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://ceres.sorbonne-universite.fr/Projo
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Si les données sont dans un dépôt séparé, décommenter :
      # - name: Checkout data
      #   uses: actions/checkout@v4
      #   with:
      #     repository: votre-org/votre-repo-data
      #     path: data
      #     token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Remplacer les URLs localhost
        run: |
          find data/manifestes -name "*.json" -exec sed -i \
          "s|http://localhost:4321|$SITE_URL|g" {} +
          sed -i "s|http://localhost:4321|$SITE_URL|g" data/metadata.csv
      - name: Build Astro
        run: npm run build
        env:
          DATA_PATH: ./data   # ajuster si dépôt séparé

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
